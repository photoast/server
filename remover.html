<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ChromaKey Pro - PhotoToast Utility</title>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; text-align: center; padding: 20px; background: #fafafa; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

        /* 투명 배경 체크무늬 패턴 */
        #canvas-wrap {
            margin-top: 20px;
            background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: inline-block; border: 1px solid #ddd; cursor: crosshair; position: relative;
        }
        canvas { max-width: 100%; display: block; }

        .controls { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-bottom: 20px; padding: 20px; background: #f1f3f5; border-radius: 8px; }
        .row { display: flex; align-items: center; gap: 15px; }
        .hex-display { font-weight: bold; color: #e64980; background: #fff; padding: 4px 8px; border-radius: 4px; border: 1px solid #dee2e6; min-width: 80px; }
        input[type="range"] { width: 200px; cursor: pointer; }
        button { padding: 10px 20px; cursor: pointer; background: #228be6; color: white; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #1c7ed6; }
        .info-text { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>PhotoToast Frame Maker</h2>

    <div class="controls">
        <div class="row">
            <input type="file" id="upload" accept="image/*">
            <button onclick="downloadImage()">PNG 다운로드</button>
        </div>

        <div class="row">
            <label>허용 오차(Tolerance): <span id="tolerance-val">40</span></label>
            <input type="range" id="tolerance" min="0" max="200" value="40">
            <span>|</span>
            <label>선택된 색상(HEX): <span id="hex-val" class="hex-display">#------</span></label>
        </div>
        <div class="info-text">* 이미지를 클릭해 색상을 선택하고 슬라이더로 범위를 조절하세요.</div>
    </div>

    <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const upload = document.getElementById('upload');
    const toleranceInput = document.getElementById('tolerance');
    const toleranceVal = document.getElementById('tolerance-val');
    const hexVal = document.getElementById('hex-val');

    let originalImg = null;
    let lastClickedColor = null;

    // 이미지 파일 로드
    upload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (f) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                originalImg = img;
                lastClickedColor = null; // 새 이미지 로드 시 초기화
                hexVal.textContent = "#------";
            };
            img.src = f.target.result;
        };
        reader.readAsDataURL(file);
    });

    // 슬라이더 조절 시 실시간 반영
    toleranceInput.addEventListener('input', (e) => {
        toleranceVal.textContent = e.target.value;
        if (lastClickedColor) applyChromaKey();
    });

    // 캔버스 클릭 시 색상 추출 및 처리
    canvas.addEventListener('mousedown', (e) => {
        if (!originalImg) return;

        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));

        const pixel = ctx.getImageData(x, y, 1, 1).data;
        lastClickedColor = { r: pixel[0], g: pixel[1], b: pixel[2] };

        hexVal.textContent = rgbToHex(pixel[0], pixel[1], pixel[2]);
        applyChromaKey();
    });

    // 크로마키 알고리즘 적용
    function applyChromaKey() {
        if (!originalImg || !lastClickedColor) return;

        // 원본 복구 후 다시 계산 (비파괴 방식)
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImg, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const t = parseInt(toleranceInput.value);

        for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            // 색상 간의 거리(유클리드) 계산
            const diff = Math.sqrt(
                Math.pow(r - lastClickedColor.r, 2) +
                Math.pow(g - lastClickedColor.g, 2) +
                Math.pow(b - lastClickedColor.b, 2)
            );

            if (diff < t) {
                data[i + 3] = 0; // 투명도 처리
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    function rgbToHex(r, g, b) {
        return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function downloadImage() {
        if (!originalImg) return;
        const link = document.createElement('a');
        link.download = `PhotoToast_Frame_${hexVal.textContent}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>
</body>
</html>
